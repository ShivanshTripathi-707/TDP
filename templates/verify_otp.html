{% extends "base.html" %}
{% block title %}Verify email | RoadWatch{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Enter the 6-digit code</h1>
  <p class="muted">We sent it to <strong>{{ email }}</strong>. It is valid for 10 minutes.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Verification code
      <input class="otp" name="otp" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" autofocus required>
    </label>
    <button class="btn btn-dark" type="submit">Verify email</button>
  </form>
  <form method="post" action="{{ url_for('resend_otp') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="link-btn" type="submit">Resend code</button>
  </form>
</section>
{% endblock %}
